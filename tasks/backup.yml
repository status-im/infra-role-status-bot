---
- name: 'Create timer for PostgreSQL backup'
  include_role: name=infra-role-systemd-timer
  vars:
    systemd_timer_description:    'Dump status_bot PostgreSQL database.'
    systemd_timer_name:           '{{ status_bot_db_backup_service_name }}'
    systemd_timer_user:           '{{ status_bot_db_backup_user }}'
    systemd_timer_frequency:      '{{ status_bot_db_backup_frequency }}'
    systemd_timer_timeout_sec:    '{{ status_bot_db_backup_timeout }}'
    systemd_timer_after_extra:    'docker.service'
    systemd_timer_start_on_creation: false
    systemd_timer_script_content: |
      #!/usr/bin/env bash
      BKP_DIR="{{ status_bot_db_backup_vol }}/{{ status_bot_db_name }}"
      rm -vfr "${BKP_DIR}"
      /usr/bin/docker exec -i -e PGPORT={{ status_bot_db_cont_port }} {{ status_bot_db_cont_name }} \
        pg_dump -F directory -f "/backup/{{ status_bot_db_name }}" -U {{ status_bot_db_admin_user }} {{ status_bot_db_name }}
      chmod 750 -R "${BKP_DIR}"

- name: 'Create timer for Status Backend backup'
  include_role: name=infra-role-systemd-timer
  vars:
    systemd_timer_description:    'Dump status_bot backend database.'
    systemd_timer_name:           '{{ status_bot_backend_backup_service_name }}'
    systemd_timer_user:           '{{ status_bot_backend_backup_user }}'
    systemd_timer_frequency:      '{{ status_bot_backend_backup_frequency }}'
    systemd_timer_timeout_sec:    '{{ status_bot_backend_backup_timeout }}'
    systemd_timer_after_extra:    'docker.service'
    systemd_timer_start_on_creation: false
    systemd_timer_script_content: |
      #!/usr/bin/env bash
      BKP_DIR="{{ status_bot_backup_vol }}/backend"
      rm -vfr "${BKP_DIR}"
      cp -r {{ status_bot_backend_cont_vol_data }} "${BKP_DIR}"
      chmod 750 -R "${BKP_DIR}"

